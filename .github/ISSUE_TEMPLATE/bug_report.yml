name: Bug report
description: Report something that doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not attach screen recordings, screenshots of personal content, or the analysis cache.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a 30-second recording of …
        2. Choose …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Stillset version
      description: Shown in Stillset → About Stillset.
      placeholder: 0.1.0 (1)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 27.0.1, MacBook Pro M4
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic report
      description: |
        Choose Help → Export Diagnostic…, review the file, then drag it here. It contains versions, processing stages, and error codes only. See docs/diagnostics.md.
